<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 추억 테스트</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-adsense-account" content="ca-pub-6105967501455663">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6105967501455663"
     crossorigin="anonymous"></script>
</head>
<body class="dark-mode">
    <div class="splash-screen" id="splashScreen">
        <div class="splash-logo">💙</div>
        <p class="splash-title">우리의 추억</p>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">💙 우리의 추억</h1>
            <button class="theme-toggle" id="themeToggle" title="다크모드 전환">
                <span class="toggle-icon">🌙</span>
            </button>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <p class="subtitle">함께한 모든 순간들을 담아두세요</p>
        </header>

        <section class="gallery-section">
            <h2>📸 추억의 사진들</h2>
            <div class="gallery">
                <div class="gallery-item" data-photo-id="photo-1" data-photo-title="수원 인계동 인생네컷">
                    <div class="gallery-photo-wrap">
                        <img src="KakaoTalk_20260801_223015357.jpg" alt="수원 인계동 인생네컷">
                        <div class="gallery-hover-veil"></div>
                    </div>
                    <div class="gallery-info">
                        <div class="gallery-info-text">
                            <p class="gallery-title">수원 인계동 인생네컷</p>
                            <p class="gallery-date">2026.08.01</p>
                        </div>
                        <div class="gallery-actions">
                            <button type="button" class="gallery-like-btn" data-photo-id="photo-1">
                                <span class="like-icon">🤍</span>
                                <span class="like-count">0</span>
                            </button>
                            <span class="gallery-comment-count" data-photo-id="photo-1">
                                💬 <span class="comment-count-num">0</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="gallery-item" data-photo-id="photo-2" data-photo-title="함께한 순간">
                    <div class="gallery-photo-wrap">
                        <img src="KakaoTalk_20260731_222509934.jpg" alt="추억의 사진">
                        <div class="gallery-hover-veil"></div>
                    </div>
                    <div class="gallery-info">
                        <div class="gallery-info-text">
                            <p class="gallery-title">함께한 순간</p>
                            <p class="gallery-date">2026.07.31</p>
                        </div>
                        <div class="gallery-actions">
                            <button type="button" class="gallery-like-btn" data-photo-id="photo-2">
                                <span class="like-icon">🤍</span>
                                <span class="like-count">0</span>
                            </button>
                            <span class="gallery-comment-count" data-photo-id="photo-2">
                                💬 <span class="comment-count-num">0</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="gallery-item" data-photo-id="photo-3" data-photo-title="1년 기념">
                    <div class="gallery-photo-wrap">
                        <img src="KakaoTalk_20260731_173415595_02.png" alt="1년 기념 사진">
                        <div class="gallery-hover-veil"></div>
                    </div>
                    <div class="gallery-info">
                        <div class="gallery-info-text">
                            <p class="gallery-title">1년 기념</p>
                            <p class="gallery-date">2026.07.31</p>
                        </div>
                        <div class="gallery-actions">
                            <button type="button" class="gallery-like-btn" data-photo-id="photo-3">
                                <span class="like-icon">🤍</span>
                                <span class="like-count">0</span>
                            </button>
                            <span class="gallery-comment-count" data-photo-id="photo-3">
                                💬 <span class="comment-count-num">0</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>새로운 데이트 기록하기</h2>
            <form id="dateForm" class="date-form">
                <div class="form-group">
                    <label for="dateInput">날짜</label>
                    <input type="date" id="dateInput" required>
                </div>

                <div class="form-group">
                    <label for="locationInput">장소</label>
                    <input type="text" id="locationInput" placeholder="예: 카페, 공원..." required>
                </div>

                <div class="form-group">
                    <label for="descriptionInput">설명</label>
                    <textarea id="descriptionInput" placeholder="무엇을 했는지 적어주세요..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="moodInput">기분</label>
                    <select id="moodInput" required>
                        <option value="">선택하세요</option>
                        <option value="😍">😍 행복해</option>
                        <option value="😊">😊 좋아</option>
                        <option value="😌">😌 편해</option>
                        <option value="🎉">🎉 설레</option>
                        <option value="💭">💭 소중해</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">기록 추가</button>
            </form>
        </section>

        <section class="stats-section">
            <div class="stat-card">
                <h3>총 데이트</h3>
                <p class="stat-number" id="totalDates">0</p>
            </div>
            <div class="stat-card">
                <h3>이번달</h3>
                <p class="stat-number" id="monthDates">0</p>
            </div>
            <div class="stat-card">
                <h3>가장 많이 간 곳</h3>
                <p class="stat-text" id="favoriteLocation">-</p>
            </div>
        </section>

        <section class="records-section">
            <h2>데이트 기록</h2>
            <div id="recordsList" class="records-list">
                <p class="no-records">아직 기록이 없습니다. 첫 데이트를 기록해보세요!</p>
            </div>
        </section>

        <section class="contact-section">
            <h2>문의 받기</h2>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="contactName">이름</label>
                    <input type="text" id="contactName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="contactEmail">이메일</label>
                    <input type="email" id="contactEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="contactSubject">제목</label>
                    <input type="text" id="contactSubject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="contactMessage">메시지</label>
                    <textarea id="contactMessage" name="message" required></textarea>
                </div>

                <button type="submit" class="btn-submit">문의 전송</button>
            </form>
        </section>
    </div>

    <footer class="footer">
        <p>💕 함께한 모든 순간을 소중하게 보관합니다</p>
    </footer>

    <div class="photo-modal" id="photoModal">
        <div class="photo-modal-overlay" id="photoModalOverlay"></div>
        <div class="photo-modal-sheet">
            <div class="photo-modal-handle"></div>
            <button class="photo-modal-close" id="photoModalClose" aria-label="닫기">✕</button>
            <div class="photo-modal-image-wrap">
                <img id="photoModalImage" class="photo-modal-image" src="" alt="">
            </div>
            <div class="photo-modal-comments">
                <h3 id="photoModalTitle">댓글</h3>
                <div id="photoModalCommentsSlot"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
