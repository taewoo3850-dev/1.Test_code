<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 추억 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">💙 우리의 추억</h1>
            <button class="theme-toggle" id="themeToggle" title="다크모드 전환">
                <span class="toggle-icon">🌙</span>
            </button>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <p class="subtitle">함께한 모든 순간들을 담아두세요</p>
        </header>

        <section class="gallery-section">
            <h2>📸 추억의 사진들</h2>
            <div class="gallery">
                <div class="gallery-item">
                    <img src="KakaoTalk_20260801_223015357.jpg" alt="수원 인계동 인생네컷">
                    <div class="gallery-info">
                        <p class="gallery-title">수원 인계동 인생네컷</p>
                        <p class="gallery-date">2026.08.01</p>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="KakaoTalk_20260731_222509934.jpg" alt="추억의 사진">
                    <div class="gallery-info">
                        <p class="gallery-title">함께한 순간</p>
                        <p class="gallery-date">2026.07.31</p>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="KakaoTalk_20260731_173415595_02.png" alt="1년 기념 사진">
                    <div class="gallery-info">
                        <p class="gallery-title">1년 기념</p>
                        <p class="gallery-date">2026.07.31</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>새로운 데이트 기록하기</h2>
            <form id="dateForm" class="date-form">
                <div class="form-group">
                    <label for="dateInput">날짜</label>
                    <input type="date" id="dateInput" required>
                </div>

                <div class="form-group">
                    <label for="locationInput">장소</label>
                    <input type="text" id="locationInput" placeholder="예: 카페, 공원..." required>
                </div>

                <div class="form-group">
                    <label for="descriptionInput">설명</label>
                    <textarea id="descriptionInput" placeholder="무엇을 했는지 적어주세요..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="moodInput">기분</label>
                    <select id="moodInput" required>
                        <option value="">선택하세요</option>
                        <option value="😍">😍 행복해</option>
                        <option value="😊">😊 좋아</option>
                        <option value="😌">😌 편해</option>
                        <option value="🎉">🎉 설레</option>
                        <option value="💭">💭 소중해</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">기록 추가</button>
            </form>
        </section>

        <section class="stats-section">
            <div class="stat-card">
                <h3>총 데이트</h3>
                <p class="stat-number" id="totalDates">0</p>
            </div>
            <div class="stat-card">
                <h3>이번달</h3>
                <p class="stat-number" id="monthDates">0</p>
            </div>
            <div class="stat-card">
                <h3>가장 많이 간 곳</h3>
                <p class="stat-text" id="favoriteLocation">-</p>
            </div>
        </section>

        <section class="records-section">
            <h2>데이트 기록</h2>
            <div id="recordsList" class="records-list">
                <p class="no-records">아직 기록이 없습니다. 첫 데이트를 기록해보세요!</p>
            </div>
        </section>

        <section class="comments-section">
            <h2>댓글 💬</h2>
            <div id="cusdis_thread"
                data-host="https://cusdis.com"
                data-app-id="5ea9934a-3870-4f56-bc66-1e89c0d8a657"
                data-page-id="home"
                data-page-url="https://1-test-code.pages.dev/"
                data-page-title="우리의 추억"
            ></div>
        </section>

        <section class="contact-section">
            <h2>문의 받기</h2>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="contactName">이름</label>
                    <input type="text" id="contactName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="contactEmail">이메일</label>
                    <input type="email" id="contactEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="contactSubject">제목</label>
                    <input type="text" id="contactSubject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="contactMessage">메시지</label>
                    <textarea id="contactMessage" name="message" required></textarea>
                </div>

                <button type="submit" class="btn-submit">문의 전송</button>
            </form>
        </section>
    </div>

    <footer class="footer">
        <p>💕 함께한 모든 순간을 소중하게 보관합니다</p>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
    <script src="script.js"></script>
</body>
</html>
